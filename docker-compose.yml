  #   command: postgres -c 'hba_file=/etc/postgresql/pg_hba.conf'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "4008:80"
    volumes:
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - whole-system-network
    depends_on:
      - postgres-cms
      - postgres-lms
      # - postgres-bms
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4004:8080"
    networks:
      - whole-system-network
    restart: unless-stopped
    environment:
      - DOZZLE_LEVEL=${DOZZLE_LEVEL}
      - DOZZLE_TAIL=${DOZZLE_TAIL}

  file-service:
    build:
      context: ./app/file-service
      dockerfile: Dockerfile
    networks:
      - whole-system-network
    depends_on:
      consul:
        condition: service_healthy
    ports:
      - "4005:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONSUL_ENABLED=true
      - FILE_SERVICE_CONSUL_ADDRESS=consul
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FILE_SERVICE_PORT=${FILE_SERVICE_PORT}
    restart: unless-stopped

  email-service:
    build:
      context: ./app/email-service
      dockerfile: Dockerfile
    networks:
      - whole-system-network
    depends_on:
      consul:
        condition: service_healthy
    ports:
      - "4006:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EMAIL_SERVICE_PORT=${EMAIL_SERVICE_PORT}

      - CONSUL_ENABLED=true
      - EMAIL_SERVICE_CONSUL_ADDRESS=consul
      - EMAIL_SERVICE_CONSUL_SERVICE_NAME=email-service
      - EMAIL_SERVICE_CONSUL_SERVICE_ID=email-api-1

      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
    restart: unless-stopped

  ai-service:
    build:
      context: ./app/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    networks:
      - whole-system-network
    ports:
      - "4007:8086"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CONSUL_HOST=consul
      - SERVICE_PORT=8086
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
networks:
  whole-system-network:
    driver: bridge

volumes:
  postgres-cms:
    driver: local
  postgres-lms:
    driver: local
  # postgres-bms:
  #   driver: local
  consul-data:
    driver: local
  consul-config:
    driver: local