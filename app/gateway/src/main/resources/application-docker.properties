spring.application.name=gateway-service

spring.cloud.consul.enabled=true

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.loadbalancer.retry.enabled=true

# Explicit routes as fallback (in case service discovery has issues)
spring.cloud.gateway.routes[0].id=cms-service-fallback
spring.cloud.gateway.routes[0].uri=lb://cms-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/cms/**
spring.cloud.gateway.routes[0].filters[0].name=StripPrefix
spring.cloud.gateway.routes[0].filters[0].args.parts=1

spring.cloud.gateway.routes[1].id=lms-service-fallback
spring.cloud.gateway.routes[1].uri=http://lms-main-system:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/lms/**
spring.cloud.gateway.routes[1].filters[0].name=StripPrefix
spring.cloud.gateway.routes[1].filters[0].args.parts=2

spring.cloud.gateway.routes[2].id=file-service-fallback
spring.cloud.gateway.routes[2].uri=lb://file-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/file/**
spring.cloud.gateway.routes[2].filters[0].name=StripPrefix
spring.cloud.gateway.routes[2].filters[0].args.parts=2

spring.cloud.gateway.routes[3].id=email-service-fallback
spring.cloud.gateway.routes[3].uri=lb://email-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/email/**
spring.cloud.gateway.routes[3].filters[0].name=StripPrefix
spring.cloud.gateway.routes[3].filters[0].args.parts=2

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.consul=INFO
logging.level.org.springframework.cloud.loadbalancer=INFO
logging.level.com.netflix.loadbalancer=INFO

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
app.cors.allowed-origins=${ALLOWED_ORIGINS}