spring.application.name=gateway-service

server.port=8080

spring.cloud.consul.enabled=false

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=cms-service
spring.cloud.gateway.routes[0].uri=lb://cms-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/cms/**
spring.cloud.gateway.routes[0].filters[0].name=StripPrefix
spring.cloud.gateway.routes[0].filters[0].args.parts=1

spring.cloud.gateway.routes[1].id=lms-service
spring.cloud.gateway.routes[1].uri=http://host.docker.internal:4003
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/lms/**
spring.cloud.gateway.routes[1].filters[0].name=StripPrefix
spring.cloud.gateway.routes[1].filters[0].args.parts=2

spring.cloud.gateway.routes[2].id=file-service
spring.cloud.gateway.routes[2].uri=lb://file-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/file/**
spring.cloud.gateway.routes[2].filters[0].name=StripPrefix
spring.cloud.gateway.routes[2].filters[0].args.parts=2

spring.cloud.gateway.routes[3].id=email-service
spring.cloud.gateway.routes[3].uri=lb://email-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/email/**
spring.cloud.gateway.routes[3].filters[0].name=StripPrefix
spring.cloud.gateway.routes[3].filters[0].args.parts=2

management.endpoints.web.exposure.include=health
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}